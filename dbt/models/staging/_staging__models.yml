version: 2

models:
  - name: stg_bus_arrival
    columns:
      - name: arrival_id
        tests: [unique, not_null]
      - name: service_no
        tests: [not_null]
      - name: direction
        tests:
          - not_null
          - accepted_values: { values: [1, 2] }

  - name: stg_bus_routes
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [service_no, direction, bus_stop_code]
    columns:
      - name: service_no
        tests: [not_null]

  - name: stg_bus_services
    columns:
      - name: service_no
        tests: [not_null]
